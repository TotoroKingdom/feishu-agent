name: ci

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e . -e ".[dev]"
      - name: Backend checks
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy app
          pytest tests/test_smoke.py -q
          alembic upgrade head --sql > /tmp/alembic.sql
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Compose config
        run: docker compose config
